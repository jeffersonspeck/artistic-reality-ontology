<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARO Annotator</title>
  <link rel="stylesheet" href="style.css">
  <!-- Third-party libraries, pinned versions: Cytoscape.js (graph view) and N3.js (Turtle parsing/writing) -->
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/n3@1.17.2/browser/n3.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Toolbar: actions grouped in drop-down menus, so it takes a single line -->
  <header>
    <h1 id="app-title">ARO Annotator</h1>
    <nav class="toolbar">
      <details class="menu">
        <summary data-i18n="menuFile"></summary>
        <div class="menu-body">
          <button id="new" data-i18n="newProject"></button>
          <button id="load" data-i18n="load"></button>
          <button id="example" data-i18n="example"></button>
          <button id="save-menu" data-i18n="save"></button>
        </div>
      </details>
      <input id="file" type="file" accept=".ttl,text/turtle" hidden>
      <details class="menu">
        <summary data-i18n="menuAnalysis"></summary>
        <div class="menu-body">
          <button id="validate" data-i18n="validate"></button>
          <button id="queries" data-i18n="queries"></button>
        </div>
      </details>
      <details class="menu">
        <summary data-i18n="menuView"></summary>
        <div class="menu-body">
          <button id="show-works" data-i18n="showWorks"></button>
          <button id="show-all" data-i18n="showAll"></button>
          <hr>
          <label><span data-i18n="layoutMode"></span>
            <select id="layout-mode"><option value="tree" data-i18n="layoutTree"></option><option value="force" data-i18n="layoutForce"></option></select></label>
          <button id="relayout" data-i18n="layout"></button>
          <hr>
          <label class="inline"><input type="checkbox" id="edge-labels" checked> <span data-i18n="edgeLabels"></span></label>
          <label class="inline"><input type="checkbox" id="full-text"> <span data-i18n="fullTexts"></span></label>
        </div>
      </details>
      <details class="menu">
        <summary data-i18n="menuExport"></summary>
        <div class="menu-body">
          <button id="export-png" data-i18n="exportPng"></button>
          <button id="print" data-i18n="print"></button>
        </div>
      </details>
      <details class="menu">
        <summary data-i18n="menuLanguage"></summary>
        <div class="menu-body">
          <label><span data-i18n="uiLanguage"></span> <select id="ui-lang"></select></label>
          <label><span data-i18n="contentLanguage"></span> <select id="content-lang"></select></label>
        </div>
      </details>
      <span class="sep"></span>
      <button id="save" class="primary" data-i18n="save"></button>
    </nav>
    <!-- Panels: show/hide each side panel, or leave the whole screen to the graph -->
    <div class="toolbar panels">
      <button id="toggle-left" class="toggle" data-i18n="panelCreate" data-i18n-title="togglePanel"></button>
      <button id="toggle-right" class="toggle" data-i18n="panelInspector" data-i18n-title="togglePanel"></button>
      <button id="maximize" data-i18n="maximizeGraph" data-i18n-title="maximizeHelp"></button>
    </div>
  </header>

  <!-- Shown only in focus mode (?focus=IRI) -->
  <div id="focus-bar"></div>

  <main>
    <!-- Left: create nodes -->
    <!-- Each section can be folded; the panel itself can be hidden and resized -->
    <aside id="left">
      <div class="panel-head"><h2 data-i18n="panelCreate"></h2>
        <button class="icon" data-hide-panel="left" data-i18n-title="hidePanel">«</button></div>
      <!-- Add nodes from the selected one: its type decides which children (this → new)
           and parents (new → this) the ontology allows; without a selection, standalone nodes -->
      <details class="section" open>
        <summary data-i18n="addNode"></summary>
        <div id="add-panel"></div>
      </details>
      <!-- Works list (tick to show/hide each work) and nodes hidden one by one -->
      <details class="section" open>
        <summary data-i18n="visibility"></summary>
        <div id="works"></div>
        <div id="hidden-list"></div>
        <p class="muted small" id="count"></p>
      </details>
      <details class="section">
        <summary data-i18n="settings"></summary>
        <label data-i18n="baseIri"></label>
        <input id="base-iri" type="url">
        <p class="muted small" data-i18n="hint"></p>
      </details>
    </aside>
    <!-- Drag to resize the panel; double-click to hide it; when hidden, the button reopens it -->
    <div id="split-left" class="splitter" data-i18n-title="resizeSide">
      <button class="reopen" data-show-panel="left" data-i18n-title="showPanel">»</button>
    </div>

    <!-- Centre: graph -->
    <section id="graph-wrap">
      <div id="graph"></div>
      <!-- Back from the graph-only view -->
      <button id="restore" data-i18n="restoreLayout"></button>
      <!-- Floating panels: validation results, CQ/RQ queries and their results -->
      <div id="validation" class="float"></div>
      <div id="queries-panel" class="float"></div>
    </section>

    <div id="split-right" class="splitter" data-i18n-title="resizeSide">
      <button class="reopen" data-show-panel="right" data-i18n-title="showPanel">«</button>
    </div>
    <!-- Right: inspector of the selected node -->
    <aside id="inspector-panel">
      <div class="panel-head"><h2 data-i18n="panelInspector"></h2>
        <button class="icon" data-hide-panel="right" data-i18n-title="hidePanel">»</button></div>
      <div id="inspector"></div>
    </aside>
  </main>

  <footer id="status"></footer>

  <!-- Right-click menu of a graph node -->
  <div id="context-menu" hidden></div>

  <!-- Filled just before printing; the only thing visible on paper -->
  <div id="print-area"></div>
</body>
</html>
