<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARO Annotator</title>
  <link rel="stylesheet" href="style.css">
  <!-- Third-party libraries, pinned versions: Cytoscape.js (graph view) and N3.js (Turtle parsing/writing) -->
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/n3@1.17.2/browser/n3.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1 id="app-title">ARO Annotator</h1>
    <div class="toolbar">
      <button id="new" data-i18n="newProject"></button>
      <button id="load" data-i18n="load"></button>
      <input id="file" type="file" accept=".ttl,text/turtle" hidden>
      <button id="example" data-i18n="example"></button>
      <button id="save" class="primary" data-i18n="save"></button>
      <button id="validate" data-i18n="validate"></button>
      <span class="sep"></span>
      <button id="show-works" data-i18n="showWorks"></button>
      <button id="show-all" data-i18n="showAll"></button>
      <select id="layout-mode" aria-label="layout"><option value="tree" data-i18n="layoutTree"></option><option value="force" data-i18n="layoutForce"></option></select>
      <button id="relayout" data-i18n="layout"></button>
      <label class="inline"><input type="checkbox" id="edge-labels" checked> <span data-i18n="edgeLabels"></span></label>
      <span class="sep"></span>
      <button id="export-png" data-i18n="exportPng"></button>
      <button id="print" data-i18n="print"></button>
      <span class="sep"></span>
      <label><span data-i18n="uiLanguage"></span> <select id="ui-lang"></select></label>
      <label><span data-i18n="contentLanguage"></span> <select id="content-lang"></select></label>
    </div>
  </header>

  <!-- Shown only in focus mode (?focus=IRI) -->
  <div id="focus-bar"></div>

  <main>
    <!-- Left: create nodes -->
    <aside id="left">
      <h2 data-i18n="addNode"></h2>
      <label data-i18n="chooseClass"></label>
      <select id="class-select"></select>
      <p id="class-help" class="muted small"></p>
      <label data-i18n="nodeName"></label>
      <input id="node-name" type="text">
      <button id="create" class="primary" data-i18n="create"></button>
      <hr>
      <label data-i18n="baseIri"></label>
      <input id="base-iri" type="url">
      <p class="muted small" data-i18n="hint"></p>
      <hr>
      <!-- Works list (tick to show/hide each work) and nodes hidden one by one -->
      <div id="works"></div>
      <div id="hidden-list"></div>
      <p class="muted small" id="count"></p>
    </aside>

    <!-- Centre: graph -->
    <section id="graph-wrap">
      <div id="graph"></div>
      <div id="validation"></div>
    </section>

    <!-- Right: inspector of the selected node -->
    <aside id="inspector"></aside>
  </main>

  <footer id="status"></footer>

  <!-- Filled just before printing; the only thing visible on paper -->
  <div id="print-area"></div>
</body>
</html>
